listener 8883 0.0.0.0
allow_anonymous false
password_file /run/roadsense/mqtt/password_file
acl_file /run/roadsense/mqtt/acl_file

certfile /run/roadsense/mqtt/server.crt
keyfile /run/roadsense/mqtt/server.key
tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 1
autosave_on_changes true
pid_file /tmp/mosquitto.pid
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
set_tcp_nodelay true
# One unacknowledged QoS message per subscriber makes the broker the bounded
# backpressure boundary. Paho callbacks can enqueue without ever blocking the
# network loop; the next message is released only after manual acknowledgement.
max_inflight_messages 1
max_queued_messages 10000
