per_listener_settings true
listener 8883 0.0.0.0
allow_anonymous false
password_file /run/roadsense/mqtt/password_file
acl_file /run/roadsense/mqtt/acl_file

certfile /run/roadsense/mqtt/server.crt
keyfile /run/roadsense/mqtt/server.key
tls_version tlsv1.2

persistence false
pid_file /tmp/mosquitto.pid
log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true
set_tcp_nodelay true
