name: roadsense-local

x-sensor-image: &sensor-image
  image: roadsense/sensor-replay:phase02-local
  build:
    context: ../..
    dockerfile: services/sensor-replay/Dockerfile
    target: runtime

x-sensor-environment: &sensor-environment
  env_file:
    - ../../config/environments/local/.env.phase02
  volumes:
    - type: bind
      source: ${MQTT_RUNTIME_DIR:?run tools/prepare_phase02_local.sh}/ca.crt
      target: /run/roadsense/mqtt/ca.crt
      read_only: true
  networks:
    - roadsense
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=8m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-processor-image: &processor-image
  image: roadsense/signal-processor:phase03-local
  build:
    context: ../..
    dockerfile: services/signal-processor/Dockerfile
    target: runtime

x-processor-environment: &processor-environment
  env_file:
    - ../../config/environments/local/.env.phase02
  volumes:
    - type: bind
      source: ${MQTT_RUNTIME_DIR:?run tools/prepare_phase02_local.sh}/ca.crt
      target: /run/roadsense/mqtt/ca.crt
      read_only: true
    - type: volume
      source: processor-state
      target: /var/lib/roadsense-processor
  networks:
    - roadsense
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=8m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-analyzer-image: &analyzer-image
  image: roadsense/road-analyzer:phase04-local
  build:
    context: ../..
    dockerfile: services/road-analyzer/Dockerfile
    target: runtime

x-analyzer-environment: &analyzer-environment
  user: "${LOCAL_UID:?run tools/prepare_phase02_local.sh}:${LOCAL_GID:?run tools/prepare_phase02_local.sh}"
  env_file:
    - ../../config/environments/local/.env.phase02
  volumes:
    - type: bind
      source: ${MQTT_RUNTIME_DIR:?run tools/prepare_phase02_local.sh}/ca.crt
      target: /run/roadsense/mqtt/ca.crt
      read_only: true
    - type: bind
      source: ../../config/environments/local/runtime/postgres
      target: /run/roadsense/postgres
      read_only: true
  networks:
    - roadsense
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=8m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-api-image: &api-image
  image: roadsense/api:phase05-local
  build:
    context: ../..
    dockerfile: services/api/Dockerfile
    target: runtime

x-dashboard-image: &dashboard-image
  image: roadsense/dashboard:phase05-local
  build:
    context: ../..
    dockerfile: services/dashboard/Dockerfile
    target: runtime

services:
  mqtt-data-init:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command: ["chmod 700 /mosquitto/data && chown -R ${LOCAL_UID}:${LOCAL_GID} /mosquitto/data"]
    volumes:
      - type: volume
        source: mqtt-data
        target: /mosquitto/data
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
    security_opt:
      - no-new-privileges:true
    restart: "no"

  mqtt-auth-init:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    user: "${LOCAL_UID:?run tools/prepare_phase02_local.sh}:${LOCAL_GID:?run tools/prepare_phase02_local.sh}"
    env_file:
      - ../../config/environments/local/.env.phase02
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mosquitto_passwd -b -c /run/roadsense/mqtt/password_file "$$MQTT_USERNAME" "$$MQTT_PASSWORD"
        printf 'user %s\ntopic readwrite roadsense/v1/imu/raw\ntopic readwrite roadsense/v1/imu/run-complete\ntopic readwrite roadsense/v1/imu/features\ntopic readwrite roadsense/v1/events\ntopic read $$SYS/#\n' "$$MQTT_USERNAME" > /run/roadsense/mqtt/acl_file
        chmod 600 /run/roadsense/mqtt/password_file /run/roadsense/mqtt/acl_file
    volumes:
      - type: bind
        source: ${MQTT_RUNTIME_DIR:?run tools/prepare_phase02_local.sh}
        target: /run/roadsense/mqtt
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

  mqtt-broker:
    image: eclipse-mosquitto:2.0.22@sha256:81a6193ae693942a3231cd3ac52875b02b7e3a19da671b2fb4b55cc874c5b279
    user: "${LOCAL_UID}:${LOCAL_GID}"
    depends_on:
      mqtt-auth-init:
        condition: service_completed_successfully
      mqtt-data-init:
        condition: service_completed_successfully
    env_file:
      - ../../config/environments/local/.env.phase02
    volumes:
      - type: bind
        source: ./mosquitto/mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
        read_only: true
      - type: bind
        source: ${MQTT_RUNTIME_DIR}
        target: /run/roadsense/mqtt
        read_only: true
      - type: volume
        source: mqtt-data
        target: /mosquitto/data
    networks:
      - roadsense
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mosquitto_sub -h localhost -p 8883 --cafile /run/roadsense/mqtt/ca.crt -u \"$${MQTT_USERNAME}\" -P \"$${MQTT_PASSWORD}\" -t '$$SYS/broker/version' -C 1 -W 3 >/dev/null",
        ]
      interval: 2s
      timeout: 4s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  sensor-replay:
    <<: [*sensor-image, *sensor-environment]
    depends_on:
      mqtt-broker:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${ROADSENSE_DATASET_ROOT:?set the private dataset path}
        target: /data/archives
        read_only: true
      - type: bind
        source: ${MQTT_RUNTIME_DIR}/ca.crt
        target: /run/roadsense/mqtt/ca.crt
        read_only: true
    restart: "no"

  signal-processor:
    <<: [*processor-image, *processor-environment]
    environment:
      PROCESSOR_QUEUE_CAPACITY: ${PROCESSOR_QUEUE_CAPACITY:-1024}
      PROCESSOR_REJECTED_TOMBSTONE_LIMIT: ${PROCESSOR_REJECTED_TOMBSTONE_LIMIT:-1024}
    depends_on:
      mqtt-broker:
        condition: service_healthy
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "python", "-m", "signal_processor.health"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  postgres:
    image: postgres:16.6-bookworm@sha256:557fea37a744d5f4c8faab304b0a90858b53ab119735a88c131fd19dab802f36
    env_file:
      - ../../config/environments/local/.env.phase02
    environment:
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    group_add:
      - "${LOCAL_GID}"
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql/data
      - type: bind
        source: ../../config/environments/local/runtime/postgres
        target: /run/roadsense/postgres
        read_only: true
    networks:
      - roadsense
    tmpfs:
      - /var/run/postgresql:rw,nosuid,size=8m
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=$$(cat \"$${POSTGRES_PASSWORD_FILE}\") psql -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -tAc 'SELECT 1' | grep -qx 1"]
      interval: 2s
      timeout: 4s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  analyzer-migrate:
    <<: [*analyzer-image, *analyzer-environment]
    entrypoint: ["python", "-m", "road_analyzer.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  road-analyzer:
    <<: [*analyzer-image, *analyzer-environment]
    environment:
      ANALYZER_QUEUE_CAPACITY: ${ANALYZER_QUEUE_CAPACITY:-1024}
      ANALYZER_VIBRATION_RMS_THRESHOLD_MG: ${ANALYZER_VIBRATION_RMS_THRESHOLD_MG:-100.0}
      ANALYZER_RULE_VERSION: ${ANALYZER_RULE_VERSION:-roadsense-high-vibration-rms-v1-t100}
    depends_on:
      mqtt-broker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      analyzer-migrate:
        condition: service_completed_successfully
    stop_grace_period: 15s
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "road_analyzer.health"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 3s

  api:
    <<: *api-image
    user: "${LOCAL_UID:?run tools/prepare_phase02_local.sh}:${LOCAL_GID:?run tools/prepare_phase02_local.sh}"
    env_file:
      - ../../config/environments/local/.env.phase02
    volumes:
      - type: bind
        source: ../../config/environments/local/runtime/postgres
        target: /run/roadsense/postgres
        read_only: true
    networks:
      - roadsense
      - browser
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_HOST_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      analyzer-migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"]
      interval: 3s
      timeout: 4s
      retries: 20
      start_period: 3s
    restart: unless-stopped

  dashboard:
    <<: *dashboard-image
    env_file:
      - ../../config/environments/local/.env.phase02
    networks:
      - browser
    ports:
      - "${DASHBOARD_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_HOST_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=2).read()"]
      interval: 3s
      timeout: 4s
      retries: 30
      start_period: 5s
    restart: unless-stopped

  postgres-password-rotate:
    <<: [*analyzer-image, *analyzer-environment]
    entrypoint: ["python", "-m", "road_analyzer.rotate_password"]
    profiles: ["maintenance"]
    volumes:
      - type: bind
        source: ../../config/environments/local/runtime/postgres
        target: /run/roadsense/postgres
    networks:
      - roadsense
    restart: "no"

  mqtt-subscriber:
    <<: [*sensor-image, *sensor-environment]
    entrypoint: ["python", "-m", "sensor_replay.subscriber"]
    profiles: ["test"]
    restart: "no"

  feature-subscriber:
    <<: [*processor-image, *processor-environment]
    entrypoint: ["python", "-m", "signal_processor.feature_subscriber"]
    profiles: ["test"]
    restart: "no"

  event-subscriber:
    <<: [*analyzer-image, *analyzer-environment]
    entrypoint: ["python", "-m", "road_analyzer.event_subscriber"]
    profiles: ["test"]
    restart: "no"

  unit-tests:
    image: roadsense/sensor-replay-test:phase02-local
    build:
      context: ../..
      dockerfile: services/sensor-replay/Dockerfile
      target: test
    profiles: ["test"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  processor-unit-tests:
    image: roadsense/signal-processor-test:phase03-local
    build:
      context: ../..
      dockerfile: services/signal-processor/Dockerfile
      target: test
    profiles: ["test"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  analyzer-unit-tests:
    image: roadsense/road-analyzer-test:phase04-local
    build:
      context: ../..
      dockerfile: services/road-analyzer/Dockerfile
      target: test
    profiles: ["test"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api-unit-tests:
    image: roadsense/api-test:phase05-local
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      target: test
    profiles: ["test"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api-credential-rotation-helper:
    image: roadsense/api-test:phase05-local
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
      target: test
    entrypoint: ["python", "tests/credential_rotation_helper.py"]
    user: "${LOCAL_UID:?run tools/prepare_phase02_local.sh}:${LOCAL_GID:?run tools/prepare_phase02_local.sh}"
    env_file:
      - ../../config/environments/local/.env.phase02
    volumes:
      - type: bind
        source: ../../config/environments/local/runtime/postgres
        target: /run/roadsense/postgres
    networks:
      - roadsense
    profiles: ["test"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  dashboard-smoke-tests:
    image: roadsense/dashboard-test:phase05-local
    build:
      context: ../..
      dockerfile: services/dashboard/Dockerfile
      target: test
    profiles: ["test"]
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  dashboard-integration-helper:
    image: roadsense/dashboard-test:phase05-local
    build:
      context: ../..
      dockerfile: services/dashboard/Dockerfile
      target: test
    entrypoint: ["python", "tests/integration_helper.py"]
    env_file:
      - ../../config/environments/local/.env.phase02
    networks:
      - browser
    profiles: ["test"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  analyzer-integration-helper:
    image: roadsense/road-analyzer-test:phase04-local
    build:
      context: ../..
      dockerfile: services/road-analyzer/Dockerfile
      target: test
    env_file:
      - ../../config/environments/local/.env.phase02
    volumes:
      - type: bind
        source: ${ROADSENSE_DATASET_ROOT:?set the private dataset path}
        target: /data/archives
        read_only: true
      - type: bind
        source: ${MQTT_RUNTIME_DIR}/ca.crt
        target: /run/roadsense/mqtt/ca.crt
        read_only: true
      - type: bind
        source: ../../config/environments/local/runtime/postgres
        target: /run/roadsense/postgres
        read_only: true
    networks:
      - roadsense
    profiles: ["test"]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  roadsense:
    internal: true
  browser:
    internal: false

volumes:
  mqtt-data:
    name: roadsense-local-mqtt-data
  postgres-data:
    name: roadsense-local-postgres-data
  processor-state:
    name: roadsense-local-processor-state
