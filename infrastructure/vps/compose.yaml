# ARCHIVED: abandoned personal-VPS plan; not used by current Phase 06.
name: roadsense-vps

# Never run this Compose file until Phase 06 change approval.
# Images must be immutable digest references produced by the release step.
services:
  dashboard:
    image: ${DASHBOARD_IMAGE:?set DASHBOARD_IMAGE to a pushed image digest}
    env_file:
      - dashboard.env
    ports:
      - "127.0.0.1:${DASHBOARD_HOST_PORT:-8501}:8501"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6

  # Explicitly run only when ready; NEVER start automatically on VPS reboot.
  sensor-replay:
    image: ${SENSOR_IMAGE:?set SENSOR_IMAGE to a pushed image digest}
    profiles: ["replay"]
    env_file:
      - sensor-replay.env
    volumes:
      - type: bind
        source: ${ROADSENSE_DATASET_ROOT:?provide absolute private archive directory}
        target: /data/archives
        read_only: true
      - type: bind
        source: ${MQTT_CA_HOST_PATH:?provide trusted MQTT CA certificate}
        target: /run/roadsense/mqtt/ca.crt
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=8m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: "no"
